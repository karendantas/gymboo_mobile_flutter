name: gymboo_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  dio: ^5.10.0
  dotted_border: ^3.1.0
  flame: ^1.37.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  json_annotation: ^4.12.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.5
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  google_sign_in: ^7.2.0
  battery_plus: ^7.1.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  health: ^13.3.2
  home_widget: ^0.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  drift_dev: ^2.20.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/audio/
    - assets/items/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#ffb2c8"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter_native_splash:
  color: "#ffb2c8" 
  image: "assets/icons/splash_logo.png"
  android_12:
    color: "#ffb2c8"
    image: assets/icons/splash_logo_android12.png
  web: false